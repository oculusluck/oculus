<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lucky Casino — рулетка</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #121212;
    --panel: #1b1b1b;
    --surface: #171717;
    --cell: #202020;
    --light: #e8e8e8;
    --dark: #0d0d0d;
    --ink: #ededed;
    --ink-on-light: #111111;
    --muted: #8a8a8a;
    --line: #333333;
    --mid: #6b6b6b;
    --mark: #9a9a9a;
    --font: "Onest", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    font-family: var(--font);
    color: var(--ink);
    background: var(--bg);
    padding: 28px clamp(16px, 3vw, 44px) 44px;
  }

  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
  button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  .shell { max-width: 1160px; margin: 0 auto; }

  /* ---------- header ---------- */
  .top {
    display: flex; align-items: flex-end; justify-content: space-between; gap: 16px;
    padding-bottom: 20px; margin-bottom: 32px; border-bottom: 1px solid var(--line);
  }
  .brand h1 { font-weight: 500; font-size: clamp(24px, 3.2vw, 32px); letter-spacing: -.02em; line-height: 1.1; }
  .brand p { margin-top: 4px; color: var(--muted); font-size: 14px; font-weight: 300; }

  .wallet { display: flex; align-items: flex-end; gap: 22px; }
  .balance { text-align: right; }
  .balance small { display: block; font-size: 12px; color: var(--muted); margin-bottom: 2px; }
  .balance strong { font-size: 28px; font-weight: 500; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .balance.shake { animation: shake .4s; }
  @keyframes shake { 20%,60% { transform: translateX(-4px);} 40%,80% { transform: translateX(4px);} }

  .ghost {
    padding: 9px 14px; border-radius: 8px; font-size: 13px; color: var(--muted);
    border: 1px solid var(--line); background: transparent;
    transition: color .2s, border-color .2s, background .2s;
  }
  .ghost:hover:not(:disabled) { color: var(--ink); border-color: var(--mark); }
  .ghost:disabled { opacity: .35; cursor: not-allowed; }

  /* ---------- layout ---------- */
  .layout { display: grid; grid-template-columns: minmax(300px, 460px) 1fr; gap: clamp(26px, 4.5vw, 64px); align-items: start; }

  /* ---------- wheel ---------- */
  .stage { display: flex; flex-direction: column; align-items: center; gap: 24px; }
  .wheel-wrap { width: 100%; max-width: 460px; filter: drop-shadow(0 18px 26px rgba(0,0,0,.7)); }
  .wheel-wrap svg { display: block; width: 100%; height: auto; }
  .pk.hit { stroke: var(--mark); stroke-width: 3; }

  .plate {
    position: relative; width: 100%; max-width: 460px;
    display: flex; align-items: center; gap: 16px;
    padding: 14px 18px; border-radius: 12px;
    background: var(--panel); border: 1px solid var(--line);
  }
  .res-num {
    flex: none; width: 56px; height: 56px; border-radius: 50%;
    display: grid; place-items: center; font-size: 24px; font-weight: 500;
    background: transparent; color: var(--ink); border: 1px solid var(--mark);
    transition: background .3s, color .3s;
  }
  .res-num.red { background: var(--light); color: var(--ink-on-light); border-color: var(--light); }
  .res-num.black { background: var(--dark); color: var(--ink); border-color: var(--mark); }
  .res-num.green { background: var(--mid); color: #fff; border-color: var(--mid); }
  .res-num.pop { animation: pop .5s cubic-bezier(.2, 1.5, .4, 1); }
  @keyframes pop { from { transform: scale(.5); } to { transform: scale(1); } }
  .res-text strong { display: block; font-weight: 500; font-size: 18px; letter-spacing: -.01em; }
  .res-text span { font-size: 14px; color: var(--muted); font-weight: 300; }
  .res-text span.plus { color: var(--ink); font-weight: 500; }
  .res-text span.minus { color: var(--muted); }
  .float {
    position: absolute; right: 20px; top: -4px; font-weight: 500; font-size: 24px; color: var(--ink);
    pointer-events: none; animation: floatUp 1.8s ease-out forwards;
  }
  @keyframes floatUp { from { opacity: 1; transform: translateY(0);} to { opacity: 0; transform: translateY(-40px);} }

  .history { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; min-height: 28px; max-width: 460px; }
  .dot {
    width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center;
    font-size: 12px; font-weight: 500; border: 1px solid var(--mark);
  }
  .dot.red { background: var(--light); color: var(--ink-on-light); border-color: var(--light); }
  .dot.black { background: var(--dark); color: var(--ink); }
  .dot.green { background: var(--mid); color: #fff; border-color: var(--mid); }
  .dot:first-child { outline: 1px solid var(--ink); outline-offset: 3px; }

  /* ---------- table ---------- */
  .table { display: flex; flex-direction: column; gap: 22px; }
  .board {
    display: flex; flex-direction: column; gap: 10px;
    padding: 12px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line);
  }
  .grp {
    display: grid; gap: 1px; padding: 1px; border-radius: 8px; overflow: hidden;
    background: #3a3a3a;
  }
  .zero-row { grid-template-columns: 1fr; }
  .numbers { grid-template-columns: repeat(12, 1fr); grid-template-rows: repeat(3, minmax(54px, 1fr)); }
  .numbers .cell { grid-row: var(--r); grid-column: var(--c); }
  .dozens { grid-template-columns: repeat(3, 1fr); }
  .outside { grid-template-columns: repeat(6, 1fr); }

  .cell {
    position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 48px; padding: 4px; font-weight: 500; font-size: 17px;
    background-color: var(--cell); color: var(--ink);
    transition: transform .15s, background-color .2s;
  }
  .cell.red { background-color: var(--light); color: var(--ink-on-light); }
  .cell.black { background-color: var(--dark); color: var(--ink); }
  .cell.green { background-color: var(--mid); color: #fff; }
  .cell .lbl { font-size: 14px; }
  .cell small { font-size: 11px; font-weight: 300; opacity: .6; }
  .cell.zero { min-height: 44px; letter-spacing: .1em; }
  .cell:hover { background-image: linear-gradient(rgba(160,160,160,.2), rgba(160,160,160,.2)); }
  .cell:active { transform: scale(.96); }
  body.spinning .cell { pointer-events: none; }

  .cell.win { outline: 3px solid var(--mark); outline-offset: -3px; animation: pulse 1s ease-in-out 3; z-index: 1; }
  .cell.hit { outline: 3px solid var(--mark); outline-offset: -3px; z-index: 2; }
  @keyframes pulse { 50% { outline-color: transparent; } }

  .stake {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    min-width: 28px; height: 28px; padding: 0 5px; border-radius: 50%;
    display: grid; place-items: center; font-size: 11px; font-weight: 600; font-style: normal;
    color: var(--ink-on-light); background: var(--light); border: 2px solid #111;
    box-shadow: 0 0 0 1px rgba(255,255,255,.35), 0 3px 6px rgba(0,0,0,.55); pointer-events: none;
    animation: drop .26s cubic-bezier(.3, 1.5, .5, 1);
  }
  .stake[hidden] { display: none; }
  @keyframes drop { from { transform: translate(-50%, -230%) scale(1.25); opacity: 0; } to { transform: translate(-50%, -50%); opacity: 1; } }

  /* ---------- controls ---------- */
  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 16px 28px; }
  .chips { display: flex; gap: 10px; align-items: center; }
  .chips-label { font-size: 14px; color: var(--muted); margin-right: 4px; }
  .chip {
    width: 50px; height: 50px; border-radius: 50%; display: grid; place-items: center;
    font-weight: 500; font-size: 14px; color: var(--ink);
    border: 1.5px solid var(--mark); background: transparent;
    transition: transform .2s cubic-bezier(.3,1.6,.5,1), background .2s, color .2s, border-color .2s;
  }
  .chip:hover:not(:disabled) { transform: translateY(-2px); border-color: var(--ink); }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--ink-on-light); border-color: var(--ink); transform: translateY(-4px); }
  .chip:disabled { opacity: .45; cursor: not-allowed; }

  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .total { margin-left: auto; text-align: right; font-size: 13px; color: var(--muted); }
  .total strong { display: block; font-size: 22px; font-weight: 500; color: var(--ink); font-variant-numeric: tabular-nums; }

  .spin {
    width: 100%; padding: 17px 24px; border-radius: 12px;
    font-size: 17px; font-weight: 500; letter-spacing: .01em; color: var(--ink-on-light);
    background: var(--ink); transition: background .2s, transform .1s;
  }
  .spin:hover:not(:disabled) { background: #ffffff; }
  .spin:active:not(:disabled) { transform: scale(.99); }
  .spin:disabled { background: #2c2c2c; color: #6f6f6f; cursor: not-allowed; }

  .notice { margin-top: 34px; text-align: center; font-size: 13px; color: var(--muted); font-weight: 300; }

  /* ---------- responsive ---------- */
  @media (max-width: 1000px) { .layout { grid-template-columns: 1fr; } }
  @media (max-width: 700px) {
    .numbers { grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(12, 44px); }
    .numbers .cell { grid-row: var(--vr); grid-column: var(--vc); }
    .outside { grid-template-columns: repeat(3, 1fr); }
    .top { flex-wrap: wrap; }
    .total { margin-left: 0; text-align: left; }
    .chip { width: 46px; height: 46px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01s !important; animation-iteration-count: 1 !important; transition-duration: .01s !important; }
  }
</style>
</head>

<body>
<div class="shell">
  <header class="top">
    <div class="brand">
      <h1>Lucky Casino</h1>
      <p>Европейская рулетка · демо</p>
    </div>
    <div class="wallet">
      <div class="balance" id="balanceBox">
        <small>Баланс</small>
        <strong id="balance">5 000</strong>
      </div>
      <button class="ghost" id="resetBtn" title="Вернуть 5 000 демо-монет">Сбросить</button>
    </div>
  </header>

  <div class="layout">
    <section class="stage" aria-label="Колесо рулетки">
      <div class="wheel-wrap" id="wheelWrap"></div>

      <div class="plate" aria-live="polite">
        <div class="res-num" id="resNum">–</div>
        <div class="res-text">
          <strong id="resTitle">Делайте ставки</strong>
          <span id="resSub">Поставь фишки на стол и нажми «Крутить».</span>
        </div>
      </div>

      <div class="history" id="history" aria-label="Последние номера"></div>
    </section>

    <section class="table" aria-label="Игровой стол">
      <div class="board" id="board">
        <div class="grp zero-row" id="zeroRow"></div>
        <div class="grp numbers" id="numbers"></div>
        <div class="grp dozens" id="dozens"></div>
        <div class="grp outside" id="outside"></div>
      </div>

      <div class="controls">
        <div class="chips" role="group" aria-label="Номинал фишки">
          <span class="chips-label">Фишка</span>
          <button class="chip" data-v="10" aria-pressed="false">10</button>
          <button class="chip" data-v="50" aria-pressed="true">50</button>
          <button class="chip" data-v="100" aria-pressed="false">100</button>
          <button class="chip" data-v="500" aria-pressed="false">500</button>
        </div>
        <div class="total">На столе<strong id="total">0</strong></div>
      </div>

      <div class="actions">
        <button class="ghost" id="undoBtn">Отменить</button>
        <button class="ghost" id="clearBtn">Очистить стол</button>
        <button class="ghost" id="repeatBtn">Повторить</button>
        <button class="ghost" id="doubleBtn">Удвоить</button>
      </div>

      <button class="spin" id="spinBtn">Крутить</button>
    </section>
  </div>

  <p class="notice">Демо-игра: монеты виртуальные, реальных денег и платежей здесь нет.</p>
</div>

<script>
(function () {
  "use strict";

  /* ================= data ================= */
  const ORDER = [0,32,15,19,4,21,2,25,17,34,6,27,13,36,11,30,8,23,10,5,24,16,33,1,20,14,31,9,22,18,29,7,28,12,35,3,26];
  const REDS = new Set([1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36]);
  const colorOf = n => n === 0 ? "green" : REDS.has(n) ? "red" : "black";
  const STEP = 360 / 37;
  const angleOf = n => ORDER.indexOf(n) * STEP;

  const OUTSIDE = [
    { key: "low",   label: "1–18",    mult: 2, test: n => n >= 1 && n <= 18 },
    { key: "even",  label: "Чёт",     mult: 2, test: n => n > 0 && n % 2 === 0 },
    { key: "red",   label: "Красное", mult: 2, test: n => colorOf(n) === "red",   cls: "red" },
    { key: "black", label: "Чёрное",  mult: 2, test: n => colorOf(n) === "black", cls: "black" },
    { key: "odd",   label: "Нечёт",   mult: 2, test: n => n % 2 === 1 },
    { key: "high",  label: "19–36",   mult: 2, test: n => n >= 19 }
  ];
  const DOZENS = [
    { key: "d1", label: "1–12",  mult: 3, test: n => n >= 1  && n <= 12 },
    { key: "d2", label: "13–24", mult: 3, test: n => n >= 13 && n <= 24 },
    { key: "d3", label: "25–36", mult: 3, test: n => n >= 25 }
  ];
  function betInfo(key) {
    if (key.startsWith("n:")) { const v = +key.slice(2); return { mult: 36, test: n => n === v }; }
    return OUTSIDE.concat(DOZENS).find(b => b.key === key);
  }

  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const $ = s => document.querySelector(s);
  const fmt = v => v.toLocaleString("ru-RU");

  /* ================= wheel (SVG, grayscale) ================= */
  const C = 200, POCKET_R = 135, TRACK_R = 173;
  const polar = (r, a) => { const t = a * Math.PI / 180; return [C + r * Math.sin(t), C - r * Math.cos(t)]; };
  const sector = (r1, r2, a1, a2) => {
    const [x1,y1] = polar(r2,a1), [x2,y2] = polar(r2,a2), [x3,y3] = polar(r1,a2), [x4,y4] = polar(r1,a1);
    return `M${x1} ${y1}A${r2} ${r2} 0 0 1 ${x2} ${y2}L${x3} ${y3}A${r1} ${r1} 0 0 0 ${x4} ${y4}Z`;
  };

  function buildWheel() {
    const fills = { red: "#e8e8e8", black: "#0d0d0d", green: "#6b6b6b" };
    const inks  = { red: "#111111", black: "#e8e8e8", green: "#ffffff" };
    let pockets = "", labels = "";
    ORDER.forEach((n, i) => {
      const a = i * STEP, col = colorOf(n);
      pockets += `<path class="pk" id="pk-${n}" d="${sector(112, 158, a - STEP/2, a + STEP/2)}" fill="${fills[col]}" stroke="#4a4a4a" stroke-width=".8"/>`;
      labels += `<text x="${C}" y="${C - 146}" transform="rotate(${a} ${C} ${C})" text-anchor="middle" dominant-baseline="middle" font-family="Onest, sans-serif" font-size="11.5" font-weight="500" fill="${inks[col]}">${n}</text>`;
    });
    $("#wheelWrap").innerHTML = `
    <svg viewBox="0 0 400 400" role="img" aria-label="Колесо европейской рулетки">
      <defs>
        <filter id="ballSh" x="-60%" y="-60%" width="240%" height="240%"><feDropShadow dx="1" dy="2" stdDeviation="1.6" flood-color="#000" flood-opacity=".45"/></filter>
      </defs>
      <circle cx="${C}" cy="${C}" r="198" fill="#2e2e2e"/>
      <circle cx="${C}" cy="${C}" r="190" fill="#1a1a1a"/>
      <circle cx="${C}" cy="${C}" r="160" fill="#4a4a4a"/>
      <g id="wheelRot">
        ${pockets}
        ${labels}
        <circle cx="${C}" cy="${C}" r="112" fill="#222222" stroke="#4a4a4a" stroke-width="1.5"/>
        <circle cx="${C}" cy="${C}" r="84" fill="none" stroke="#333333" stroke-width="1"/>
                      </g>
      <circle id="ball" r="6.6" fill="#ffffff" stroke="#1b1b1b" stroke-width="1.5" filter="url(#ballSh)"/>
    </svg>`;
  }
  buildWheel();
  const wheelG = $("#wheelRot"), ball = $("#ball");

  /* ================= state ================= */
  const START_BALANCE = 5000;
  let balance = START_BALANCE, shownBalance = START_BALANCE;
  let chip = 50, bets = {}, betLog = [], lastBets = null;
  let spinning = false;
  let wheelAngle = 0, restNum = 0, ballAbs = angleOf(0), ballR = POCKET_R;
  let history = [];
  let pendingPayout = 0;

  /* ================= saving (localStorage) ================= */
  const STORE_KEY = "lucky-casino-v1";
  function save() {
    try {
      // stakes still lying on the table are counted as balance, so a reload never eats them
      const safe = spinning ? balance + pendingPayout : balance + total();
      localStorage.setItem(STORE_KEY, JSON.stringify({ balance: safe, history: history, chip: chip, lastBets: lastBets }));
    } catch (e) { /* storage unavailable (private mode etc.) — the game still works */ }
  }
  (function load() {
    try {
      const d = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
      if (!d) return;
      if (Number.isFinite(d.balance) && d.balance >= 0) { balance = Math.floor(d.balance); shownBalance = balance; }
      if (Array.isArray(d.history)) history = d.history.filter(n => Number.isInteger(n) && n >= 0 && n <= 36).slice(0, 14);
      if ([10, 50, 100, 500].includes(d.chip)) chip = d.chip;
      if (d.lastBets && typeof d.lastBets === "object") {
        const clean = {};
        for (const k in d.lastBets) { if (betInfo(k) && Number.isFinite(d.lastBets[k]) && d.lastBets[k] > 0) clean[k] = d.lastBets[k]; }
        if (Object.keys(clean).length) lastBets = clean;
      }
    } catch (e) {}
  })();

  const balEl = $("#balance"), totalEl = $("#total");
  const spinBtn = $("#spinBtn"), undoBtn = $("#undoBtn"), clearBtn = $("#clearBtn"),
        repeatBtn = $("#repeatBtn"), doubleBtn = $("#doubleBtn"), resetBtn = $("#resetBtn");

  /* ================= board ================= */
  const cells = {};
  function makeCell(key, cls, html, parent, style) {
    const b = document.createElement("button");
    b.className = "cell " + cls;
    b.dataset.key = key;
    if (style) b.style.cssText = style;
    b.innerHTML = html + '<i class="stake" hidden></i>';
    b.addEventListener("click", () => placeBet(key));
    parent.appendChild(b);
    cells[key] = b;
    return b;
  }
  const zero = makeCell("n:0", "green zero", "0", $("#zeroRow"));
  zero.setAttribute("aria-label", "Зеро, выплата 36 к 1");
  for (let n = 1; n <= 36; n++) {
    const r = n % 3 === 0 ? 1 : n % 3 === 2 ? 2 : 3;
    const style = `--r:${r};--c:${Math.ceil(n/3)};--vr:${Math.ceil(n/3)};--vc:${(n-1)%3+1}`;
    const el = makeCell("n:" + n, colorOf(n), String(n), $("#numbers"), style);
    el.setAttribute("aria-label", `${n}, ${colorOf(n) === "red" ? "красное" : "чёрное"}, выплата 36 к 1`);
  }
  DOZENS.forEach(d => makeCell(d.key, "", `<span class="lbl">${d.label}</span><small>×3</small>`, $("#dozens")));
  OUTSIDE.forEach(o => makeCell(o.key, o.cls || "", `<span class="lbl">${o.label}</span><small>×2</small>`, $("#outside")));

  const total = () => Object.values(bets).reduce((a, b) => a + b, 0);
  const short = v => v >= 10000 ? Math.round(v / 1000) + "k" : v >= 1000 ? (v / 1000).toFixed(1).replace(".0", "") + "k" : String(v);

  function renderBets() {
    for (const key in cells) {
      const st = cells[key].querySelector(".stake");
      const v = bets[key];
      if (v) {
        if (st.hidden || st.textContent !== short(v)) { st.hidden = false; st.style.animation = "none"; void st.offsetWidth; st.style.animation = ""; }
        st.textContent = short(v);
      } else { st.hidden = true; }
    }
    const t = total();
    totalEl.textContent = fmt(t);
    spinBtn.disabled = spinning || t === 0;
    undoBtn.disabled = spinning || betLog.length === 0;
    clearBtn.disabled = spinning || t === 0;
    doubleBtn.disabled = spinning || t === 0;
    repeatBtn.disabled = spinning || !lastBets;
    resetBtn.disabled = spinning;
    save();
  }

  function clearMarks() {
    for (const k in cells) cells[k].classList.remove("win", "hit");
    document.querySelectorAll(".pk.hit").forEach(p => p.classList.remove("hit"));
  }

  function setBalance(v, animate) {
    const from = shownBalance;
    balance = v;
    if (!animate || reduce) { shownBalance = v; balEl.textContent = fmt(v); return; }
    const s = performance.now();
    (function f(now) {
      const t = Math.min(1, (now - s) / 900);
      shownBalance = Math.round(from + (v - from) * (1 - Math.pow(1 - t, 3)));
      balEl.textContent = fmt(shownBalance);
      if (t < 1) requestAnimationFrame(f);
    })(s);
  }

  function renderHistory() {
    $("#history").innerHTML = history.map(h => `<span class="dot ${colorOf(h)}">${h}</span>`).join("");
  }

  function say(title, sub, tone) {
    $("#resTitle").textContent = title;
    const s = $("#resSub");
    s.textContent = sub;
    s.className = tone || "";
  }

  /* ================= betting actions ================= */
  function placeBet(key, amount) {
    if (spinning) return;
    const a = amount || chip;
    if (balance < a) {
      const box = $("#balanceBox");
      box.classList.remove("shake"); void box.offsetWidth; box.classList.add("shake");
      say("Не хватает монет", "Выбери фишку поменьше или сбрось баланс.");
      return;
    }
    clearMarks();
    balance -= a; shownBalance = balance; balEl.textContent = fmt(balance);
    bets[key] = (bets[key] || 0) + a;
    betLog.push({ key, a });
    if (total() === a) say("Ставки принимаются", "Добавь ещё или нажми «Крутить».");
    renderBets();
  }
  function refundAll() {
    const t = total();
    balance += t; shownBalance = balance; balEl.textContent = fmt(balance);
    bets = {}; betLog = [];
  }
  undoBtn.onclick = () => {
    if (spinning || !betLog.length) return;
    const { key, a } = betLog.pop();
    bets[key] -= a; if (bets[key] <= 0) delete bets[key];
    balance += a; shownBalance = balance; balEl.textContent = fmt(balance);
    renderBets();
  };
  clearBtn.onclick = () => { if (spinning) return; refundAll(); renderBets(); };
  repeatBtn.onclick = () => {
    if (spinning || !lastBets) return;
    refundAll(); clearMarks();
    const need = Object.values(lastBets).reduce((a, b) => a + b, 0);
    if (need > balance) { say("Не хватает монет", `Прошлые ставки — ${fmt(need)}, а на балансе ${fmt(balance)}.`); renderBets(); return; }
    for (const k in lastBets) { bets[k] = lastBets[k]; betLog.push({ key: k, a: lastBets[k] }); }
    balance -= need; shownBalance = balance; balEl.textContent = fmt(balance);
    renderBets();
  };
  doubleBtn.onclick = () => {
    if (spinning) return;
    const t = total();
    if (!t) return;
    if (t > balance) { say("Не хватает монет", "Чтобы удвоить, нужно ещё " + fmt(t - balance) + "."); return; }
    Object.keys(bets).slice().forEach(k => { const a = bets[k]; bets[k] += a; betLog.push({ key: k, a }); });
    balance -= t; shownBalance = balance; balEl.textContent = fmt(balance);
    renderBets();
  };
  resetBtn.onclick = () => {
    if (spinning) return;
    bets = {}; betLog = []; clearMarks();
    setBalance(START_BALANCE, true);
    say("Баланс восстановлен", "5 000 демо-монет на счёте.");
    renderBets();
  };
  document.querySelectorAll(".chip").forEach(c => c.addEventListener("click", () => {
    chip = +c.dataset.v;
    document.querySelectorAll(".chip").forEach(x => x.setAttribute("aria-pressed", String(x === c)));
  }));

  /* ================= animation ================= */
  function render() {
    wheelG.setAttribute("transform", `rotate(${wheelAngle} ${C} ${C})`);
    const [x, y] = polar(ballR, ballAbs);
    ball.setAttribute("cx", x); ball.setAttribute("cy", y);
  }

  let lastT = performance.now();
  function idle(now) {
    const dt = now - lastT; lastT = now;
    if (!spinning) {
      if (!reduce) wheelAngle = (wheelAngle + dt * 0.006) % 360;
      ballAbs = wheelAngle + angleOf(restNum);
      ballR = POCKET_R;
      render();
    }
    requestAnimationFrame(idle);
  }
  requestAnimationFrame(idle);

  const lerp = (a, b, t) => a + (b - a) * t;
  const easeIn = t => t * t;
  const easeOut = t => 1 - Math.pow(1 - t, 3);

  function runSpin(n) {
    return new Promise(resolve => {
      const T = reduce ? 2200 : 7400;
      const W0 = wheelAngle % 360;
      const dW = (reduce ? 360 : 1080) + Math.random() * 360;
      const Wf = W0 + dW;
      const Bf = Wf + angleOf(n);
      const D = (((ballAbs - Bf) % 360) + 360) % 360 + 360 * (reduce ? 2 : 7);
      const start = performance.now();

      (function frame(now) {
        const t = Math.min(1, (now - start) / T);
        wheelAngle = W0 + dW * easeOut(t);
        ballAbs = Bf + D * Math.pow(1 - t, 2.4);

        if (t < 0.06) ballR = lerp(POCKET_R, TRACK_R, easeOut(t / 0.06));
        else if (t < 0.6) ballR = TRACK_R;
        else if (t < 0.8) ballR = lerp(TRACK_R, POCKET_R, easeIn((t - 0.6) / 0.2));
        else { const u = (t - 0.8) / 0.2; ballR = POCKET_R - 10 * Math.pow(1 - u, 2) * Math.abs(Math.sin(u * Math.PI * 3)); }

        render();
        if (t < 1) requestAnimationFrame(frame);
        else { wheelAngle = Wf; ballAbs = Bf; ballR = POCKET_R; render(); resolve(); }
      })(start);
    });
  }

  /* ================= game ================= */
  function setSpinning(v) {
    spinning = v;
    document.body.classList.toggle("spinning", v);
    document.querySelectorAll(".chip").forEach(c => c.disabled = v);
    renderBets();
  }

  async function spin() {
    if (spinning || total() === 0) return;
    const stake = total();
    const n = Math.floor(Math.random() * 37);
    let payout = 0;
    const winKeys = [];
    for (const key in bets) {
      const info = betInfo(key);
      if (info.test(n)) { payout += bets[key] * info.mult; winKeys.push(key); }
    }
    pendingPayout = payout;
    clearMarks();
    setSpinning(true);
    say("Ставок больше нет", "Шарик пошёл…");
    $("#resNum").className = "res-num";
    $("#resNum").textContent = "…";

    await runSpin(n);
    restNum = n;
    wheelAngle = wheelAngle % 360;

    winKeys.forEach(k => cells[k].classList.add("win"));
    cells["n:" + n].classList.add("hit");
    $("#pk-" + n).classList.add("hit");

    lastBets = Object.assign({}, bets);
    bets = {}; betLog = [];
    setBalance(balance + payout, true);
    pendingPayout = 0;

    const net = payout - stake;
    const col = colorOf(n);
    const num = $("#resNum");
    num.textContent = n;
    num.className = "res-num " + col;
    void num.offsetWidth; num.classList.add("pop");

    const colName = col === "green" ? "Зеро" : col === "red" ? "Красное" : "Чёрное";
    const parity = n === 0 ? "" : n % 2 === 0 ? ", чётное" : ", нечётное";
    if (net > 0) {
      say(colName + parity, `Выигрыш +${fmt(net)} монет`, "plus");
      const f = document.createElement("div");
      f.className = "float"; f.textContent = "+" + fmt(net);
      $(".plate").appendChild(f);
      setTimeout(() => f.remove(), 1900);
    } else if (net === 0) {
      say(colName + parity, "Ставки вернулись, баланс без изменений");
    } else {
      say(colName + parity, `Проигрыш −${fmt(-net)} монет`, "minus");
    }

    history.unshift(n);
    history = history.slice(0, 14);
    renderHistory();

    setSpinning(false);
    if (balance < 10) say("Монеты закончились", "Нажми «Сбросить», чтобы начать заново.");
  }
  spinBtn.onclick = spin;

  // restore saved state
  balEl.textContent = fmt(balance);
  document.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", String(+c.dataset.v === chip)));
  if (history.length) {
    restNum = history[0];
    ballAbs = angleOf(restNum);
    renderHistory();
    const num = $("#resNum");
    num.textContent = restNum;
    num.className = "res-num " + colorOf(restNum);
    say("С возвращением", "Баланс сохранён. Делай ставки.");
  }
  if (balance < 10) say("Монеты закончились", "Нажми «Сбросить», чтобы начать заново.");
  window.addEventListener("pagehide", save);
  document.addEventListener("visibilitychange", () => { if (document.hidden) save(); });

  renderBets();
  render();
})();
</script>
</body>
</html>
